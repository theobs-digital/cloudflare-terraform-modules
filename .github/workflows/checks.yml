# The checks that need no secret, on every pull request and push to main: the
# pre-commit hooks and the mock tests of each module, then cloudflare-dns
# against the bottom of its version requirements.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit on the same branch makes the running check pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      # The versions of the README prerequisites. Checksums from the GitHub
      # release pages, not from files downloaded next to the binaries.
      - name: Install TFLint, terraform-docs and pre-commit
        working-directory: ${{ runner.temp }}
        run: |
          mkdir bin
          curl -sSfLO https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip
          echo "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537  tflint_linux_amd64.zip" | sha256sum -c -
          unzip -q tflint_linux_amd64.zip -d bin
          curl -sSfLO https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          echo "9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3  terraform-docs-v0.24.0-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf terraform-docs-v0.24.0-linux-amd64.tar.gz -C bin terraform-docs
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          pipx install pre-commit==4.5.1

      - run: pre-commit run --all-files --show-diff-on-failure

      # tests/ only: the tests against a real zone run in their own workflow.
      - name: Mock tests of each module
        run: |
          for versions in */versions.tf; do
            module=$(dirname "$versions")
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" test
          done

  # The bottom of the README requirements: Terraform 1.3 and provider 5.27.0.
  # Validate only: the tests and the import example need Terraform 1.7.
  minimum-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: cloudflare-dns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.3.10
          terraform_wrapper: false

      # In the module folder, it also pins the examples that call the module.
      - name: Pin the provider to 5.27.0
        run: |
          cat > override.tf <<'EOF'
          terraform {
            required_providers {
              cloudflare = {
                source  = "cloudflare/cloudflare"
                version = "5.27.0"
              }
            }
          }
          EOF

      - name: Validate the module and the basic and complete examples
        run: |
          for dir in . examples/basic examples/complete; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  # The same for cloudflare-zero-trust-access: Terraform 1.3 and provider 5.28.0.
  minimum-versions-zero-trust-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: cloudflare-zero-trust-access
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.3.10
          terraform_wrapper: false

      # In the module folder, it also pins the examples that call the module.
      - name: Pin the provider to 5.28.0
        run: |
          cat > override.tf <<'EOF'
          terraform {
            required_providers {
              cloudflare = {
                source  = "cloudflare/cloudflare"
                version = "5.28.0"
              }
            }
          }
          EOF

      - name: Validate the module and the basic and complete examples
        run: |
          for dir in . examples/basic examples/complete; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
