# The tests against the real API, every day. Lock files are not committed, so
# each run takes the newest provider 5.x and catches its regressions.
name: Real API tests

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once would create the same objects twice.
concurrency: tests-real

jobs:
  cloudflare-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: cloudflare-dns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - run: terraform init -backend=false

      # A run cut short leaves its records behind, and the next one would fail
      # on them: delete tf-test.<zone> and the names under it, nothing else.
      - name: Delete records left under tf-test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: ${{ secrets.TEST_ZONE }}
        run: |
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone_id=$(curl -sSf -H "$auth" "$api/zones?name=$ZONE" | jq -er '.result[0].id')
          curl -sSf -H "$auth" "$api/zones/$zone_id/dns_records?name.contains=tf-test&per_page=1000" |
            jq -r --arg zone "$ZONE" '.result[] | select(.name == "tf-test.\($zone)" or (.name | endswith(".tf-test.\($zone)"))) | "\(.id) \(.name)"' |
            while read -r id name; do
              echo "Deleting $name"
              curl -sSf -X DELETE -H "$auth" "$api/zones/$zone_id/dns_records/$id" > /dev/null
            done

      # Secrets rather than variables: GitHub masks them in the public logs.
      - run: terraform test -test-directory=tests-real -var "name=$ZONE" -var "account_id=$ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: ${{ secrets.TEST_ZONE }}
          ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}

  # Apply, plan again, destroy: a second plan with a change is a provider that
  # drifts from what it applied, such as provider issue #7120.
  cloudflare-zero-trust-access:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: cloudflare-zero-trust-access/tests-real
    # Secrets rather than variables: GitHub masks them in the public logs.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ZERO_TRUST_TEST_API_TOKEN }}
      TF_VAR_account_id: ${{ secrets.ZERO_TRUST_TEST_ACCOUNT_ID }}
      TF_VAR_zone: ${{ secrets.ZERO_TRUST_TEST_ZONE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - run: terraform init -input=false

      # A run cut short leaves its objects behind, and the next one would fail
      # on them: delete what is named tf-test-ci-*, nothing else. Users of an
      # object go before it.
      - name: Delete Access objects left under tf-test-ci
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$TF_VAR_account_id"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # The IDs, or the third argument, of the objects of a list whose
          # field starts with tf-test-ci-.
          ids() {
            curl -sSf -H "$auth" "$api/$1" |
              jq -r --arg field "$2" --arg out "${3:-id}" '.result[] | select((.[$field] // "") | startswith("tf-test-ci-")) | .[$out]'
          }
          delete() {
            echo "Deleting $1"
            curl -sSf -X DELETE -H "$auth" "$api/$1" > /dev/null
          }
          for id in $(ids access/apps name); do
            # The SSH CA of the application, if it has one.
            curl -sS -X DELETE -H "$auth" "$api/access/apps/$id/ca" > /dev/null
            delete "access/apps/$id"
          done
          for id in $(ids "access/policies?per_page=1000" name); do delete "access/policies/$id"; done
          for id in $(ids access/groups name); do delete "access/groups/$id"; done
          for id in $(ids access/service_tokens name); do delete "access/service_tokens/$id"; done
          for id in $(ids "access/identity_providers?per_page=1000" name); do delete "access/identity_providers/$id"; done
          for id in $(ids "access/ai-controls/mcp/portals?per_page=100" id); do delete "access/ai-controls/mcp/portals/$id"; done
          for id in $(ids "access/ai-controls/mcp/servers?per_page=100" id); do delete "access/ai-controls/mcp/servers/$id"; done
          # A tag's ID is its name.
          for name in $(ids "access/tags?per_page=1000" name name); do delete "access/tags/$name"; done
          for id in $(ids "infrastructure/targets?hostname_contains=tf-test-ci-" hostname); do delete "infrastructure/targets/$id"; done

      - run: terraform apply -auto-approve -input=false

      # Exit code 2: the plan has a change.
      - run: terraform plan -detailed-exitcode -input=false

      - name: Destroy what the run created
        if: always()
        run: terraform destroy -auto-approve -input=false
