# Publishes each cloudflare-dns release through mirror.yml.
# Mirror, the repository the Registry reads: terraform-cloudflare-dns
# Its deploy key, with write access: secrets.MIRROR_DEPLOY_KEY_CLOUDFLARE_DNS
# Both must exist before the first tag.
name: Mirror cloudflare-dns

on:
  push:
    tags: ["cloudflare-dns/v*"]
  # For a tag whose commit predates this file: a push runs the workflows of
  # the tagged commit.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as cloudflare-dns/v1.2.0
        required: true

jobs:
  mirror:
    uses: ./.github/workflows/mirror.yml
    with:
      module: cloudflare-dns
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    secrets:
      deploy_key: ${{ secrets.MIRROR_DEPLOY_KEY_CLOUDFLARE_DNS }}
