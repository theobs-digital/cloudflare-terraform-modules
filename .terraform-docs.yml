# Types as HCL blocks: a table squeezes the records type into one unreadable cell.
formatter: markdown document

output:
  file: README.md
  mode: inject

content: |-
  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}

sort:
  enabled: true
  by: required

settings:
  indent: 3
  # Show the version constraints, not the provider pinned by a local init.
  lockfile: false
  sensitive: true
