formatter: markdown table

output:
  file: README.md
  mode: inject

content: |-
  {{ .Requirements }}

  {{ .Providers }}

  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}

sort:
  enabled: true
  by: required

settings:
  indent: 2
  # Show the version constraints, not the provider pinned by a local init.
  lockfile: false
  sensitive: true
